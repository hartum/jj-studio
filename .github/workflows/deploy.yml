name: Deploy JJ Studio to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            TARGET_DIR="/var/www/jjstudio_har_usr/data/www/jjstudio.hartum.net"
            git config --global --add safe.directory $TARGET_DIR
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR

            if [ ! -d ".git" ]; then
              git clone https://github.com/hartum/jj-studio.git .
            else
              git fetch origin main
              git reset --hard origin/main
            fi

            # Build Frontend on VPS
            cd $TARGET_DIR/frontend
            pnpm install
            pnpm build

            # Install, Update DB Schema & Restart Backend with PM2
            cd $TARGET_DIR/backend
            pnpm install
            npx prisma generate
            npx prisma db push --accept-data-loss
            pm2 restart jjstudio-backend || pm2 start src/index.ts --name jjstudio-backend --interpreter ./node_modules/.bin/tsx

            # Fix Permissions & Save PM2
            chown -R jjstudio_har_usr:jjstudio_har_usr $TARGET_DIR
            pm2 save
